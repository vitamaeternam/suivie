<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0F1219">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Ilyes Phone Service</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#0F1219;--sf:#171C26;--sf2:#1E2433;--brd:#272F3E;--mute:#5A6577;--soft:#8B95A8;--ink:#D9DFE8;--white:#F0F2F5;
--accent:#E8852B;--green:#2ECC71;--red:#E74C3C;--purple:#8B5CF6;--blue:#3B82F6;--teal:#0EA5A9;--pink:#EC4899;--amber:#F59E0B}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100dvh;-webkit-font-smoothing:antialiased;padding-bottom:72px}
.hdr{padding:calc(env(safe-area-inset-top,8px)+10px) 14px 10px;background:var(--sf);border-bottom:1px solid var(--brd);display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100}
.hdr-t{font-size:15px;font-weight:800;color:var(--white);flex:1}
.hdr-s{font-size:11px;color:var(--soft)}
.hb{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;background:var(--sf2);border:1px solid var(--brd);cursor:pointer}
.hb:active{background:var(--brd)}
.stats{display:flex;gap:6px;padding:10px 14px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.st{flex-shrink:0;padding:8px 14px;background:var(--sf);border:1px solid var(--brd);border-radius:10px;text-align:center;cursor:pointer;min-width:55px}
.st.on{border-color:var(--accent);background:rgba(232,133,43,.08)}
.st .n{font-size:18px;font-weight:800;color:var(--white)}.st .l{font-size:9px;color:var(--mute);margin-top:2px;text-transform:uppercase}
.srch{padding:8px 14px}
.srch input{width:100%;padding:10px 14px;background:var(--sf);border:1px solid var(--brd);border-radius:10px;color:var(--ink);font-size:14px;font-family:inherit}
.srch input::placeholder{color:var(--mute)}
.list{padding:0 14px}
.bon{background:var(--sf);border:1px solid var(--brd);border-radius:14px;padding:14px;margin-bottom:8px;cursor:pointer}
.bon:active{border-color:var(--accent)}
.bon-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.bon-id{font-size:12px;font-weight:700;color:var(--mute)}
.badge{padding:3px 10px;border-radius:8px;font-size:11px;font-weight:700}
.bon-mod{font-size:15px;font-weight:700;color:var(--white);margin-bottom:2px}
.bon-cli{font-size:12px;color:var(--soft)}
.bon-pan{font-size:12px;color:var(--mute);margin-top:4px}
.bon-bot{display:flex;justify-content:space-between;align-items:center;margin-top:8px;padding-top:8px;border-top:1px solid var(--brd)}
.bon-px{font-size:14px;font-weight:800;color:var(--white)}.bon-dt{font-size:11px;color:var(--mute)}
.pri-u{font-size:10px;font-weight:800;color:var(--amber);background:rgba(245,158,11,.12);padding:2px 6px;border-radius:4px;margin-right:4px}
.pri-v{font-size:10px;font-weight:800;color:var(--pink);background:rgba(236,72,153,.12);padding:2px 6px;border-radius:4px;margin-right:4px}
/* Panel */
.panel{position:fixed;inset:0;background:var(--bg);z-index:200;overflow-y:auto;display:none;padding-bottom:20px}
.panel.open{display:block}
.ph{padding:calc(env(safe-area-inset-top,8px)+10px) 14px 12px;background:var(--sf);border-bottom:1px solid var(--brd);display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:201}
.ph-back{font-size:22px;cursor:pointer;padding:4px}.ph-t{font-size:16px;font-weight:700;color:var(--white);flex:1}
.ds{padding:14px}
.dc{background:var(--sf);border:1px solid var(--brd);border-radius:14px;padding:14px;margin-bottom:10px}
.dr{display:flex;justify-content:space-between;padding:8px 0;font-size:13px}
.dr:not(:last-child){border-bottom:1px solid var(--brd)}
.dr .k{color:var(--soft)}.dr .v{font-weight:600;color:var(--white);text-align:right;max-width:58%}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.so{padding:12px;border-radius:10px;border:2px solid var(--brd);background:var(--sf2);cursor:pointer;text-align:center;font-size:12px;font-weight:700;font-family:inherit;color:var(--ink)}
.so:active{transform:scale(.97)}.so.on{border-color:var(--accent)}
.da{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.db{padding:12px;border-radius:12px;border:1px solid var(--brd);background:var(--sf);text-align:center;cursor:pointer;font-size:12px;font-weight:700;color:var(--ink);font-family:inherit;text-decoration:none}
.db:active{border-color:var(--accent)}.db .ico{font-size:20px;display:block;margin-bottom:4px}
.db.wa{background:#25D366;border-color:#25D366;color:#fff}
/* Form */
.fg{margin-bottom:12px}
.fl{font-size:11px;font-weight:700;color:var(--soft);margin-bottom:4px;display:block}
.fi{width:100%;padding:11px 14px;background:var(--sf2);border:1px solid var(--brd);border-radius:10px;color:var(--ink);font-size:14px;font-family:inherit;resize:vertical}
.fi::placeholder{color:var(--mute)}
.btn-save{width:100%;padding:14px;border-radius:12px;border:none;font-size:15px;font-weight:800;font-family:inherit;cursor:pointer;background:var(--accent);color:#fff;margin-top:8px}
/* Nav */
.nav{position:fixed;bottom:0;left:0;right:0;background:var(--sf);border-top:1px solid var(--brd);display:flex;padding:6px 0 calc(env(safe-area-inset-bottom,0)+6px);z-index:100}
.ni{flex:1;text-align:center;padding:6px 0;cursor:pointer;font-size:10px;font-weight:600;color:var(--mute)}
.ni.on{color:var(--accent)}.ni .ic{font-size:22px;display:block;margin-bottom:2px}
/* Toast */
.toast{position:fixed;top:calc(env(safe-area-inset-top,8px)+60px);left:50%;transform:translateX(-50%);padding:10px 20px;background:var(--sf);border:1px solid var(--brd);border-radius:12px;font-size:13px;font-weight:600;color:var(--white);z-index:999;box-shadow:0 8px 30px rgba(0,0,0,.4);display:none}
.toast.show{display:block;animation:fi .2s}
@keyframes fi{from{opacity:0;transform:translateX(-50%) translateY(-10px)}to{opacity:1;transform:translateX(-50%)}}
.empty{text-align:center;padding:40px 20px;color:var(--mute)}.empty .ic{font-size:40px;margin-bottom:10px}
</style>
</head>
<body>
<div class="hdr">
  <div><div class="hdr-t">Ilyes Phone Service</div><div class="hdr-s" id="sync-st">Chargement...</div></div>
  <div class="hb" onclick="syncNow()">☁️</div>
  <div class="hb" onclick="openAdd()">➕</div>
</div>
<div class="stats" id="stats"></div>
<div class="srch"><input type="text" id="q" placeholder="🔍 Chercher n°, client, modèle, panne..." oninput="renderList()"></div>
<div class="list" id="ls"></div>

<div class="panel" id="pn-detail"><div class="ph"><div class="ph-back" onclick="closePn('pn-detail')">←</div><div class="ph-t" id="pn-t"></div><div class="hb" onclick="editCurrent()">✏️</div></div><div class="ds" id="pn-b"></div></div>
<div class="panel" id="pn-add"><div class="ph"><div class="ph-back" onclick="closePn('pn-add')">←</div><div class="ph-t">Nouveau bon</div></div><div class="ds" id="pn-add-b"></div></div>
<div class="panel" id="pn-edit"><div class="ph"><div class="ph-back" onclick="closePn('pn-edit')">←</div><div class="ph-t" id="pn-edit-t">Modifier</div></div><div class="ds" id="pn-edit-b"></div></div>

<div class="toast" id="toast"></div>
<div class="nav">
  <div class="ni on"><span class="ic">📋</span>Bons</div>
  <div class="ni" onclick="syncNow()"><span class="ic">☁️</span>Sync</div>
</div>

<script>
var CU='https://xgouaqyjpnkarhauzyyv.supabase.co';
var CK='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhnb3VhcXlqcG5rYXJoYXV6eXl2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyMzAxMDMsImV4cCI6MjEwMTgwNjEwM30.P-KDRuWX1QclZ7-5F_OkVq-SxGAoL1c8y1alHqGWbdc';
var SU='https://vitamaeternam.github.io/suivie/';
var repairs=[],nextId=1,_busy=false,curFil='',curId=0;
var ST={c:{l:'En cours',c:'#3B82F6',b:'rgba(59,130,246,.12)',e:'🔧'},a:{l:'Attente pièce',c:'#F59E0B',b:'rgba(245,158,11,.12)',e:'⏳'},d:{l:'Devis',c:'#8B5CF6',b:'rgba(139,92,246,.12)',e:'📋'},r:{l:'Réparé',c:'#2ECC71',b:'rgba(46,204,113,.12)',e:'✅'},n:{l:'Non réparable',c:'#E74C3C',b:'rgba(231,76,60,.12)',e:'❌'},t:{l:'En test',c:'#0EA5A9',b:'rgba(14,165,169,.12)',e:'🧪'},g:{l:'Récupéré',c:'#6B7080',b:'rgba(107,112,128,.12)',e:'📦'}};

function toast(m){var e=document.getElementById('toast');e.textContent=m;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(function(){e.classList.remove('show')},2500)}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function waNum(t){var n=(t||'').replace(/\s/g,'');if(n.charAt(0)==='0')n='+213'+n.substring(1);return n.replace('+','')}

// ═══ SYNC ═══
function pull(cb){
  if(_busy){if(cb)cb(false);return}_busy=true;
  document.getElementById('sync-st').textContent='Sync...';
  fetch(CU+'/rest/v1/app_data?id=eq.main&limit=1',{headers:{'apikey':CK,'Authorization':'Bearer '+CK,'Accept':'application/json'}})
  .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()})
  .then(function(rows){_busy=false;
    if(!Array.isArray(rows)||!rows.length){document.getElementById('sync-st').textContent='Vide';if(cb)cb(false);return}
    try{repairs=JSON.parse(rows[0].repairs)}catch(e){if(cb)cb(false);return}
    if(rows[0].next_id)nextId=rows[0].next_id;
    repairs.sort(function(a,b){return Number(b.id)-Number(a.id)});
    renderList();renderStats();
    document.getElementById('sync-st').textContent=repairs.length+' bons · '+new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
    if(cb)cb(true)
  }).catch(function(){_busy=false;document.getElementById('sync-st').textContent='Hors ligne';if(cb)cb(false)})
}
function push(cb){
  if(_busy)return;_busy=true;
  fetch(CU+'/rest/v1/app_data',{method:'POST',headers:{'Content-Type':'application/json','apikey':CK,'Authorization':'Bearer '+CK,'Prefer':'resolution=merge-duplicates,return=minimal'},
    body:JSON.stringify({id:'main',repairs:JSON.stringify(repairs),next_id:nextId,updated_at:new Date().toISOString()})
  }).then(function(){_busy=false;if(cb)cb(true)}).catch(function(){_busy=false;if(cb)cb(false)})
}
function syncNow(){toast('Sync...');pull(function(ok){toast(ok?'Synchronisé ('+repairs.length+')':'Erreur')})}
setInterval(function(){pull()},30000);

// ═══ RENDER ═══
function renderStats(){
  var cn={t:repairs.length,c:0,a:0,r:0,d:0,g:0};
  repairs.forEach(function(r){if(cn[r.s]!==undefined)cn[r.s]++});
  var h='';
  [['','Total',cn.t],['c','En cours',cn.c],['r','Réparés',cn.r],['a','Attente',cn.a],['d','Devis',cn.d],['g','Récup.',cn.g]].forEach(function(x){
    h+='<div class="st'+(curFil===x[0]?' on':'')+'" onclick="curFil=\''+(x[0])+'\';renderStats();renderList()"><div class="n">'+x[2]+'</div><div class="l">'+x[1]+'</div></div>'
  });
  document.getElementById('stats').innerHTML=h
}
function renderList(){
  var q=(document.getElementById('q').value||'').toLowerCase().trim();
  var fl=repairs.filter(function(r){
    if(curFil&&r.s!==curFil)return false;
    if(q){var h=(String(r.id)+r.nom+r.tel+(r.tel2||'')+r.mod+(r.panne||'')+(r.imei||'')+(r.stickerCode||'')).toLowerCase();return h.indexOf(q)>=0}
    return true
  });
  if(q&&!isNaN(q))fl.sort(function(a,b){var ae=String(a.id)===q?1:0,be=String(b.id)===q?1:0;return be-ae});
  if(!fl.length){document.getElementById('ls').innerHTML='<div class="empty"><div class="ic">📭</div>Aucun bon</div>';return}
  var h='';
  fl.forEach(function(r){
    var s=ST[r.s]||ST.c;
    var pri='';if(r.priorite==='urgent')pri='<span class="pri-u">⚠ URGENT</span>';if(r.priorite==='vip')pri='<span class="pri-v">⭐ VIP</span>';
    h+='<div class="bon" onclick="openDetail('+r.id+')">';
    h+='<div class="bon-top"><span class="bon-id">#'+r.id+'</span><span class="badge" style="background:'+s.b+';color:'+s.c+'">'+s.e+' '+s.l+'</span></div>';
    h+='<div class="bon-mod">'+pri+esc(r.mod||'—')+'</div>';
    h+='<div class="bon-cli">'+esc(r.nom||'—')+(r.tel?' · '+r.tel:'')+'</div>';
    if(r.panne)h+='<div class="bon-pan">'+esc(r.panne)+'</div>';
    h+='<div class="bon-bot"><span class="bon-px">'+(Number(r.cout)||0).toLocaleString('fr-FR')+' DA</span><span class="bon-dt">'+(r.date||'')+'</span></div>';
    h+='</div>'
  });
  document.getElementById('ls').innerHTML=h
}

// ═══ DETAIL ═══
function openDetail(id){
  curId=id;
  var r=repairs.find(function(x){return x.id===id});if(!r)return;
  var s=ST[r.s]||ST.c;
  document.getElementById('pn-t').textContent='Bon #'+r.id;
  var h='';
  h+='<div class="dc" style="text-align:center"><div class="badge" style="background:'+s.b+';color:'+s.c+';font-size:14px;padding:8px 20px">'+s.e+' '+s.l+'</div></div>';
  // Info complète
  h+='<div class="dc">';
  var fields=[['Client',r.nom],['Téléphone',r.tel],['Tél. 2',r.tel2],['Modèle',r.mod],['IMEI',r.imei],['Panne',r.panne],['Remarque',r.remarque],['Coût',r.cout?(Number(r.cout)).toLocaleString('fr-FR')+' DA':''],['Acompte',r.versement?(Number(r.versement)).toLocaleString('fr-FR')+' DA':''],['Reste',r.cout?(Math.max(0,(Number(r.cout)||0)-(Number(r.versement)||0))).toLocaleString('fr-FR')+' DA':''],['Date',r.date+(r.heure?' à '+r.heure:'')],['Technicien',r.tech],['Priorité',r.priorite==='urgent'?'⚠ Urgent':r.priorite==='vip'?'⭐ VIP':'Normal'],['Retrait prévu',r.retrait],['Code suivi',r.stickerCode]];
  fields.forEach(function(f){if(f[1])h+='<div class="dr"><span class="k">'+f[0]+'</span><span class="v">'+esc(f[1])+'</span></div>'});
  h+='</div>';
  // Statut
  h+='<div class="dc"><div style="font-size:12px;font-weight:700;color:var(--soft);margin-bottom:8px">CHANGER LE STATUT</div><div class="sg">';
  Object.keys(ST).forEach(function(k){var x=ST[k];h+='<div class="so'+(r.s===k?' on':'')+'" onclick="chgStatus('+id+',\''+k+'\')" style="'+(r.s===k?'border-color:'+x.c+';background:'+x.b:'')+'">'+x.e+' '+x.l+'</div>'});
  h+='</div></div>';
  // Actions
  h+='<div class="dc"><div style="font-size:12px;font-weight:700;color:var(--soft);margin-bottom:8px">ACTIONS</div><div class="da">';
  if(r.tel){
    var n=waNum(r.tel);
    h+='<a class="db wa" href="https://wa.me/'+n+'?text='+encodeURIComponent('Bonjour '+(r.nom||'')+', votre '+(r.mod||'appareil')+' (bon #'+r.id+') : '+(s.l)+'. — Ilyes Phone Service')+'"><span class="ico">💬</span>WhatsApp</a>';
    h+='<a class="db" href="tel:'+r.tel+'"><span class="ico">📞</span>Appeler</a>';
    if(r.tel2)h+='<a class="db" href="tel:'+r.tel2+'"><span class="ico">📞</span>Tél. 2</a>';
  }
  h+='<div class="db" onclick="showQR('+id+')"><span class="ico">📲</span>QR Suivi</div>';
  h+='<div class="db" onclick="shareLnk('+id+')"><span class="ico">🔗</span>Partager</div>';
  h+='<div class="db" onclick="editCurrent()"><span class="ico">✏️</span>Modifier</div>';
  h+='<div class="db" onclick="dupBon('+id+')"><span class="ico">📄</span>Dupliquer</div>';
  h+='</div></div>';
  // Historique client
  if(r.nom||r.tel){
    var bons=repairs.filter(function(x){return(r.tel&&x.tel===r.tel)||((r.nom||'').toLowerCase()&&(x.nom||'').toLowerCase()===(r.nom||'').toLowerCase())});
    if(bons.length>1){
      h+='<div class="dc"><div style="font-size:12px;font-weight:700;color:var(--soft);margin-bottom:8px">HISTORIQUE CLIENT ('+bons.length+' bons)</div>';
      bons.forEach(function(b){if(b.id===id)return;var bs=ST[b.s]||ST.c;
        h+='<div style="padding:8px;margin-bottom:4px;background:var(--sf2);border-radius:8px;cursor:pointer" onclick="openDetail('+b.id+')">';
        h+='<div style="display:flex;justify-content:space-between"><span style="font-size:12px;font-weight:700">#'+b.id+' '+esc(b.mod||'')+'</span><span style="font-size:10px;padding:2px 6px;border-radius:4px;background:'+bs.b+';color:'+bs.c+'">'+bs.l+'</span></div>';
        h+='<div style="font-size:11px;color:var(--mute);margin-top:2px">'+esc(b.panne||'')+(b.date?' · '+b.date:'')+'</div></div>'
      });
      h+='</div>'
    }
  }
  document.getElementById('pn-b').innerHTML=h;
  document.getElementById('pn-detail').classList.add('open')
}
function closePn(id){document.getElementById(id).classList.remove('open')}
function editCurrent(){if(curId)openEdit(curId)}

function chgStatus(id,s){
  var r=repairs.find(function(x){return x.id===id});if(!r)return;
  r.s=s;r._syncTs=Date.now();
  push(function(){toast('Statut → '+ST[s].l)});
  openDetail(id);renderList();renderStats()
}

function showQR(id){
  var r=repairs.find(function(x){return x.id===id});if(!r)return;
  var tk=btoa(String(r.id)+':'+(r.stickerCode||'000000'));
  var url=SU+'?id='+encodeURIComponent(tk);
  var h='<div class="dc" style="text-align:center">';
  h+='<img src="https://api.qrserver.com/v1/create-qr-code/?size=400x400&margin=8&data='+encodeURIComponent(url)+'" style="width:200px;height:200px;border-radius:12px">';
  h+='<div style="font-size:11px;color:var(--soft);margin-top:8px;word-break:break-all">'+url+'</div>';
  h+='<div style="margin-top:8px;font-size:14px;font-weight:700">Mot de passe : '+(r.stickerCode||'—')+'</div>';
  h+='<button onclick="navigator.clipboard.writeText(\''+url+'\').then(function(){toast(\'Copié\')})" style="margin-top:10px;padding:10px 20px;border-radius:10px;border:none;background:var(--accent);color:#fff;font-weight:700;cursor:pointer;font-family:inherit">Copier le lien</button></div>';
  document.getElementById('pn-b').innerHTML=h
}
function shareLnk(id){
  var r=repairs.find(function(x){return x.id===id});if(!r)return;
  var tk=btoa(String(r.id)+':'+(r.stickerCode||'000000'));var url=SU+'?id='+encodeURIComponent(tk);
  if(navigator.share)navigator.share({title:'Suivi #'+r.id,url:url}).catch(function(){});
  else navigator.clipboard.writeText(url).then(function(){toast('Lien copié')})
}
function dupBon(id){
  var r=repairs.find(function(x){return x.id===id});if(!r)return;
  var nr={id:nextId++,nom:r.nom,tel:r.tel,tel2:r.tel2||'',mod:'',panne:'',imei:'',remarque:'',cout:'',versement:'',date:new Date().toISOString().slice(0,10),heure:new Date().toTimeString().slice(0,5),s:'c',tech:r.tech||'',stickerCode:String(Math.floor(100000+Math.random()*900000)),_syncTs:Date.now()};
  repairs.unshift(nr);push();renderList();renderStats();
  toast('Bon #'+nr.id+' créé');closePn('pn-detail');openEdit(nr.id)
}

// ═══ NOUVEAU BON ═══
function openAdd(){
  var h='';
  h+='<div class="fg"><label class="fl">Nom du client *</label><input class="fi" id="f-nom" placeholder="Ex: Fereh Mourad"></div>';
  h+='<div class="fg"><label class="fl">Téléphone *</label><input class="fi" id="f-tel" type="tel" placeholder="0540..."></div>';
  h+='<div class="fg"><label class="fl">Téléphone 2</label><input class="fi" id="f-tel2" type="tel" placeholder="Optionnel"></div>';
  h+='<div class="fg"><label class="fl">Modèle *</label><input class="fi" id="f-mod" placeholder="Ex: iPhone 13 Pro Max"></div>';
  h+='<div class="fg"><label class="fl">IMEI</label><input class="fi" id="f-imei" placeholder="Optionnel"></div>';
  h+='<div class="fg"><label class="fl">Panne *</label><input class="fi" id="f-pan" placeholder="Ex: Écran cassé"></div>';
  h+='<div class="fg"><label class="fl">Remarque / Description</label><textarea class="fi" id="f-rem" rows="3" placeholder="Détails supplémentaires..."></textarea></div>';
  h+='<div class="fg"><label class="fl">Coût estimé (DA)</label><input class="fi" id="f-cout" type="number" placeholder="0"></div>';
  h+='<div class="fg"><label class="fl">Technicien</label><input class="fi" id="f-tech" placeholder="Optionnel"></div>';
  h+='<div class="fg"><label class="fl">Priorité</label><div style="display:flex;gap:8px"><button type="button" class="so on" id="pri-n" onclick="setPri(\'normal\')">Normal</button><button type="button" class="so" id="pri-u" onclick="setPri(\'urgent\')">⚠ Urgent</button><button type="button" class="so" id="pri-v" onclick="setPri(\'vip\')">⭐ VIP</button></div></div>';
  h+='<button class="btn-save" onclick="saveBon()">Créer le bon</button>';
  document.getElementById('pn-add-b').innerHTML=h;
  document.getElementById('pn-add').classList.add('open')
}
var _newPri='normal';
function setPri(v){_newPri=v;['pri-n','pri-u','pri-v'].forEach(function(id){var e=document.getElementById(id);if(e)e.classList.remove('on')});document.getElementById('pri-'+v.charAt(0)).classList.add('on')}
function saveBon(){
  var nom=(document.getElementById('f-nom').value||'').trim(),tel=(document.getElementById('f-tel').value||'').trim(),mod=(document.getElementById('f-mod').value||'').trim();
  if(!nom&&!mod){toast('Remplis le nom ou le modèle');return}
  var r={id:nextId++,nom:nom,tel:tel,tel2:(document.getElementById('f-tel2').value||'').trim(),mod:mod,
    imei:(document.getElementById('f-imei').value||'').trim(),panne:(document.getElementById('f-pan').value||'').trim(),
    remarque:(document.getElementById('f-rem').value||'').trim(),cout:(document.getElementById('f-cout').value||'').trim(),
    versement:'',date:new Date().toISOString().slice(0,10),heure:new Date().toTimeString().slice(0,5),
    s:'c',tech:(document.getElementById('f-tech').value||'').trim(),priorite:_newPri,
    stickerCode:String(Math.floor(100000+Math.random()*900000)),_syncTs:Date.now()};
  repairs.unshift(r);push(function(ok){toast(ok?'Bon #'+r.id+' créé + synchro':'Bon créé (sync en attente)')});
  closePn('pn-add');renderList();renderStats();_newPri='normal'
}

// ═══ MODIFIER BON ═══
function openEdit(id){
  curId=id;var r=repairs.find(function(x){return x.id===id});if(!r)return;
  document.getElementById('pn-edit-t').textContent='Modifier #'+id;
  var h='';
  var fields=[['Nom','e-nom','text',r.nom],['Téléphone','e-tel','tel',r.tel],['Tél. 2','e-tel2','tel',r.tel2],['Modèle','e-mod','text',r.mod],['IMEI','e-imei','text',r.imei],['Panne','e-pan','text',r.panne],['Coût (DA)','e-cout','number',r.cout],['Acompte (DA)','e-vers','number',r.versement],['Technicien','e-tech','text',r.tech],['Date retrait','e-retrait','date',r.retrait]];
  fields.forEach(function(f){h+='<div class="fg"><label class="fl">'+f[0]+'</label><input class="fi" id="'+f[1]+'" type="'+f[2]+'" value="'+esc(f[3]||'')+'"></div>'});
  h+='<div class="fg"><label class="fl">Remarque / Description</label><textarea class="fi" id="e-rem" rows="3">'+esc(r.remarque||'')+'</textarea></div>';
  h+='<div class="fg"><label class="fl">Priorité</label><div style="display:flex;gap:8px">';
  h+='<button type="button" class="so'+(!r.priorite||r.priorite==='normal'?' on':'')+'" id="ep-n" onclick="setEPri(\'normal\')">Normal</button>';
  h+='<button type="button" class="so'+(r.priorite==='urgent'?' on':'')+'" id="ep-u" onclick="setEPri(\'urgent\')">⚠ Urgent</button>';
  h+='<button type="button" class="so'+(r.priorite==='vip'?' on':'')+'" id="ep-v" onclick="setEPri(\'vip\')">⭐ VIP</button>';
  h+='</div></div>';
  h+='<button class="btn-save" onclick="saveEdit('+id+')">Sauvegarder</button>';
  h+='<button onclick="closePn(\'pn-edit\')" style="width:100%;padding:12px;border-radius:12px;border:1px solid var(--brd);background:transparent;color:var(--soft);font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;margin-top:8px">Annuler</button>';
  document.getElementById('pn-edit-b').innerHTML=h;
  document.getElementById('pn-edit').classList.add('open')
}
var _ePri='';
function setEPri(v){_ePri=v;['ep-n','ep-u','ep-v'].forEach(function(id){var e=document.getElementById(id);if(e)e.classList.remove('on')});document.getElementById('ep-'+v.charAt(0)).classList.add('on')}
function saveEdit(id){
  var r=repairs.find(function(x){return x.id===id});if(!r)return;
  r.nom=(document.getElementById('e-nom').value||'').trim();
  r.tel=(document.getElementById('e-tel').value||'').trim();
  r.tel2=(document.getElementById('e-tel2').value||'').trim();
  r.mod=(document.getElementById('e-mod').value||'').trim();
  r.imei=(document.getElementById('e-imei').value||'').trim();
  r.panne=(document.getElementById('e-pan').value||'').trim();
  r.remarque=(document.getElementById('e-rem').value||'').trim();
  r.cout=(document.getElementById('e-cout').value||'').trim();
  r.versement=(document.getElementById('e-vers').value||'').trim();
  r.tech=(document.getElementById('e-tech').value||'').trim();
  r.retrait=(document.getElementById('e-retrait').value||'').trim();
  if(_ePri)r.priorite=_ePri;
  r._syncTs=Date.now();
  push(function(ok){toast(ok?'Bon #'+id+' modifié + synchro':'Modifié (sync en attente)')});
  closePn('pn-edit');closePn('pn-detail');renderList();renderStats();_ePri=''
}

// ═══ INIT ═══
pull(function(){renderStats()});
</script>
</body>
